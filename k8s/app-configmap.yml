apiVersion: v1
kind: ConfigMap
metadata:
  name: bulletin-board-config
  namespace: bulletin-board

data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_HOST}:6432/${DB_NAME}?sslmode=disable"
  SPRING_PROFILES_ACTIVE: "prod"
  MANAGEMENT_SERVER_PORT: "9090"
  STORAGE_S3_BUCKET: "${S3_BUCKET}"
  STORAGE_S3_REGION: "${S3_REGION}"
  STORAGE_S3_ENDPOINT: "${S3_ENDPOINT}"